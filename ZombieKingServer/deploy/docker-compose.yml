# ZombieKing Linux 部署模板（架构文档 §8；密钥一律经 .env 注入，不进仓库）
# 用法: cp .env.example .env 并填写 → 放置 TLS 证书到 deploy/tls/ → docker compose up -d
# 首次启动: postgres 自动执行挂载的 sql/migrations/*.up.sql 与 seed.sql；
#          nakama 先 migrate up（建系统表）再启动。
# 生产 sys_config 需人工核对（本地由 init-db.ps1 写入，生产部署后执行）:
#   UPDATE game.sys_config SET value='http://ds-manager:8443' WHERE key='ds_manager_url';
#   UPDATE game.sys_config SET value='<ZK_SERVICE_TOKEN>'     WHERE key='ds_service_token';
#   UPDATE game.sys_config SET value='<ZK_SOCKET_SERVER_KEY>' WHERE key='socket_server_key';
#   UPDATE game.sys_config SET value='http://nakama:7350'     WHERE key='lobby_self_url';
#   （dev_mode 保持 false；DS 主机密钥仅存 .env/环境，不入库明文）
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${ZK_DB_USER}
      POSTGRES_PASSWORD: ${ZK_DB_PASSWORD}
      POSTGRES_DB: ${ZK_DB_NAME}
    volumes:
      - zkdata:/var/lib/postgresql/data
      - ../sql/migrations:/docker-entrypoint-initdb.d:ro
      - ../sql/seed.sql:/docker-entrypoint-initdb.d/999_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZK_DB_USER} -d ${ZK_DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.41.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../nakama/modules/dist:/nakama/data/modules/dist:ro
    entrypoint: >
      /bin/sh -c "
      /nakama/nakama migrate up --database.address postgres://${ZK_DB_USER}:${ZK_DB_PASSWORD}@postgres:5432/${ZK_DB_NAME} &&
      exec /nakama/nakama
        --database.address postgres://${ZK_DB_USER}:${ZK_DB_PASSWORD}@postgres:5432/${ZK_DB_NAME}
        --socket.server_key ${ZK_SOCKET_SERVER_KEY}
        --session.encryption_key ${ZK_SESSION_ENCRYPTION_KEY}
        --session.refresh_encryption_key ${ZK_REFRESH_ENCRYPTION_KEY}
        --runtime.path /nakama/data/modules/dist
        --runtime.js_entrypoint index.js
        --runtime.http_key ${ZK_RUNTIME_HTTP_KEY}
        --console.username ${ZK_CONSOLE_USERNAME}
        --console.password ${ZK_CONSOLE_PASSWORD}
        --console.signing_key ${ZK_CONSOLE_SIGNING_KEY}
        --console.address 127.0.0.1
        --logger.level info"
    # 对外流量一律走 nginx（TLS 反代）；7350/7351 仅绑宿主机回环供运维直连调试，gRPC 7349 不发布。
    # 备选：无 nginx 时可改用 Nakama 内置 SSL（实测键为 socket.ssl_certificate / socket.ssl_private_key，
    #       官方标注 NOT recommended for production，不推荐）。
    ports:
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - nakama
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${ZK_TLS_CERT_DIR:-./tls}:/etc/nginx/tls:ro
    ports:
      - "443:443"

  ds-manager:
    build: ../ds-manager
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZK_SERVICE_TOKEN: ${ZK_SERVICE_TOKEN}
      ZK_HOST_SECRETS: ${ZK_DS_HOST_SECRETS}
      ZK_DB_DSN: postgres://${ZK_DB_USER}:${ZK_DB_PASSWORD}@postgres:5432/${ZK_DB_NAME}?sslmode=disable
      ZK_SUSPICIOUS_LIMIT: ${ZK_SUSPICIOUS_LIMIT:-3}
      ZK_LISTEN: ":8443"
    # 内部通道仅内网监听：不发布到公网，仅绑回环供宿主机排障
    ports:
      - "127.0.0.1:8443:8443"

  # ds-agent 通常直接部署在各 DS 主机（systemd 拉起，挂载 UE5 专用服务器二进制）；
  # 此处提供容器化形态供单机一体化部署/测试，DS 二进制经 volume 注入。
  ds-agent:
    build: ../ds-agent
    depends_on:
      - ds-manager
    environment:
      ZK_HOST_ID: ${ZK_AGENT_HOST_ID:-ds-host-1}
      ZK_HOST_SECRET: ${ZK_AGENT_HOST_SECRET}
      ZK_MANAGER_URL: http://ds-manager:8443
      ZK_HOST_IP: ${ZK_AGENT_HOST_IP:-ds-agent}
      ZK_AGENT_LISTEN: ":8444"
      ZK_DS_COMMAND: ${ZK_DS_COMMAND}
    volumes:
      - ${ZK_DS_BIN_DIR:-./ds-bin}:/ds:ro
    ports:
      - "127.0.0.1:8444:8444"

volumes:
  zkdata:
