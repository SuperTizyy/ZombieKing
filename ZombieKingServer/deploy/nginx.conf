# ZombieKing 生产 TLS 终止反代（架构文档 §8：TLS 由反代承载，Nakama 内置 SSL 仅备选）
# 证书约定：deploy/tls/fullchain.pem + privkey.pem（Let's Encrypt 或自签），经 ZK_TLS_CERT_DIR 挂载。
# 转发目标：nakama 服务 7350（HTTP/WS 同端口；WebSocket Upgrade 必须透传）。
server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 客户端会话令牌/密钥均经此通道传输，HSTS 强制 HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://nakama:7350;
        proxy_http_version 1.1;
        # WebSocket 升级透传（实时通道/房间聊天/撮合广播都走 WS）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # 长连接空闲（Nakama WS 有应用层 ping，这里给足余量）
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        client_max_body_size 16k;   # Storage 单对象 ≤8KB，请求体上限从紧
    }
}
