; =============================================================================
; 内容管线：主资产（Primary Asset）扫描与分包 Cook 规则
; 说明：本段由 UAssetManager（项目实现为 UGameAssetManager，见
;       Source/ZombieKing/GameFramework/GameAssetManager.h）在启动期读取。
; =============================================================================
[/Script/Engine.AssetManagerSettings]
; 开发期不过滤"非正式(Production)"资源，便于本地迭代
bOnlyCookProductionAssets=False
; 允许引擎按"类名 + 资产名"推导主资产类型与名称（内容目录与命名稳定后，如需精细控制可关闭）
bShouldManagerDetermineTypeAndName=True
; 编辑器内允许猜测类型与名称：新建资产尚未配置时也能被扫描到，减少手工登记
bShouldGuessTypeAndNameInEditor=True
; 缺分包时不自动下载（后续接入分包/热更下载时再开启）
bShouldAcquireMissingChunksOnLoad=False

; -----------------------------------------------------------------------------
; 主资产类型扫描条目（内容侧目录约定）
; 每个条目格式：
;   +PrimaryAssetTypesToScan=(PrimaryAssetType="类型名",
;                             AssetBaseClass=/Script/<模块>.<类名>,
;                             bHasBlueprintClasses=False,bIsEditorOnly=False,
;                             Directories=((Path="/Game/<目录>")),
;                             Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
; 要点：
;   * AssetBaseClass 必须是 C++ 类（或蓝图基类）的完整类路径，扫描"该类的实例/子类"；
;   * bHasBlueprintClasses：资产是"蓝图类"时填 True，普通数据资产实例填 False；
;   * CookRule=AlwaysCook 表示"即使没有被别的资产引用也要 Cook"，必备资源必须用它。
;
; 当前只登记"必备资源清单"类型（启动加载，见 UGameAssetManager::StartInitialLoading）。
; 角色定义(GameCharacterDefinition) / 技能集(GameAbilitySet) / 输入配置(GameInputConfig) /
; 体型档案(GameCharacterBodyProfile) / Cue 通知(GameGameplayCueNotify_*) 等类型，
; 待内容目录定稿后按同样格式补充，即可获得分包与 Cook 控制能力。
; -----------------------------------------------------------------------------
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameData",AssetBaseClass=/Script/ZombieKing.GameGameData,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/GameData")),Rules=(Priority=0,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
; 界面路由表：被 UGameUISettings 以"软引用"指向（ini 里的软引用不会被 Cook 扫到），
; 故登记为 AlwaysCook 的主资产类型，保证它必定进包
+PrimaryAssetTypesToScan=(PrimaryAssetType="UIRouteTable",AssetBaseClass=/Script/ZombieKing.GameUIRouteTable,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/UI")),Rules=(Priority=0,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
; UI 本地化文案表（UStringTable）：同样被 UGameLocalizationSettings 以"软引用"指向（/Game/Localization/ST_GameUI），
; ini 里的软引用不会被 Cook 扫到，故按同格式登记为 AlwaysCook 的主资产类型，保证它必定进包。
; 说明：玩法文案不在这里 —— 它写在 Lua 脚本里（Content/Script/Lua/Core/Localization/Localization.lua），
;       随 Lua 脚本一起作为 UFS 资源打包，可热更。
+PrimaryAssetTypesToScan=(PrimaryAssetType="StringTable",AssetBaseClass=/Script/Engine.StringTable,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Localization")),Rules=(Priority=0,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
; 音频事件表（UGameAudioEventTable）：被 UGameAudioSettings 以"软引用"指向（/Game/Audio/DA_AudioEventTable），
; 同 UIRouteTable / ST_GameUI 的教训 —— ini 里的软引用不会被 Cook 扫到，必须登记为 AlwaysCook 兜住。
+PrimaryAssetTypesToScan=(PrimaryAssetType="AudioEventTable",AssetBaseClass=/Script/ZombieKing.GameAudioEventTable,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Audio")),Rules=(Priority=0,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))


