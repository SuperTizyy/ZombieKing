[/Script/UnLua.UnLuaSettings]
; =============================================================================
; UnLua 启动配置（UnLua 脚本根目录固定为 Content/Script）
; StartupModuleName: 游戏启动时自动执行的 Lua 入口模块
;   -> Lua.Core.Bootstrap 对应 Content/Script/Lua/Core/Bootstrap.lua
;   -> 该入口只负责引导 LuaPanda 调试环境（见 DebugBootstrap.lua），不含任何业务逻辑
;   -> 命名说明：它刻意不叫 GameInstance；框架层的 GameInstance 脚本是
;      Lua.Core.GameFramework.GameInstance（由 UGameGameInstance 绑定），二者职责不同
; 留空则跳过启动脚本执行（脚本绑定仍会按需惰性进行，不影响功能）。
; =============================================================================
StartupModuleName=Lua.Core.Bootstrap
